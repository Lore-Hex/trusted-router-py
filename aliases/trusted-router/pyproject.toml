[project]
name = "trusted-router"
version = "0.10.0"
description = "Alias for trusted-router-py, the official TrustedRouter Python SDK."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lore Hex" }]
keywords = ["trustedrouter", "llm", "sdk", "alias", "openai"]
dependencies = ["trusted-router-py>=0.10.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
attestation = ["trusted-router-py[attestation]>=0.10.0"]
receipts = ["trusted-router-py[receipts]>=0.10.0"]

[project.urls]
Homepage = "https://trustedrouter.com"
Documentation = "https://github.com/Lore-Hex/trusted-router-py#readme"
Issues = "https://github.com/Lore-Hex/trusted-router-py/issues"
Repository = "https://github.com/Lore-Hex/trusted-router-py"
Trust = "https://trust.trustedrouter.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Metadata only: the real SDK owns both import packages and the CLI script.
bypass-selection = true

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "README.md", "LICENSE"]
