[project]
name = "trusted-router-py"
version = "0.8.0"
description = "Official Python SDK and CLI for TrustedRouter."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["trustedrouter", "llm", "sdk", "attestation", "openai"]
authors = [{ name = "Lore Hex" }]
dependencies = ["httpx>=0.27.0", "pydantic>=2.6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
attestation = ["pyopenssl>=22.0", "cryptography"]
receipts = ["cryptography"]

[project.urls]
Homepage = "https://trustedrouter.com"
Documentation = "https://github.com/Lore-Hex/trusted-router-py#readme"
Issues = "https://github.com/Lore-Hex/trusted-router-py/issues"
Repository = "https://github.com/Lore-Hex/trusted-router-py"
Trust = "https://trust.trustedrouter.com"

[project.scripts]
trustedrouter = "trustedrouter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustedrouter"]

[tool.hatch.build.targets.sdist]
only-include = ["src/trustedrouter"]

[dependency-groups]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "cryptography>=42",
  "pyopenssl>=22.0",
  "mypy>=1.14.0",
  "hypothesis>=6.100",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=src/trustedrouter --cov-report=term-missing --cov-report=xml --cov-fail-under=87"

[tool.coverage.run]
branch = true
source = ["src/trustedrouter"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "BLE001", "PGH003", "PGH004", "RUF", "TRY"]
# Assertions document internal invariants and are used throughout tests.
# TRY003: 197 existing contextual exception messages; moving them into exception
# constructors would obscure diagnostics without strengthening boundary checks.
ignore = ["S101", "TRY003"]

[tool.mypy]
python_version = "3.10"
files = ["src/trustedrouter", "tests"]
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "trustedrouter.*"
# mypy's strict preset, expressed as per-module flags (strict itself is global).
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
