[project]
name = "trusted-router-py"
version = "0.1.0"
description = "Python SDK for TrustedRouter."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Lore Hex" }]
dependencies = ["httpx>=0.27.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://trustedrouter.com"
Repository = "https://github.com/Lore-Hex/trusted-router-py"
Trust = "https://trust.trustedrouter.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustedrouter"]

[dependency-groups]
dev = ["ruff>=0.8.0", "pytest>=8.3.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
