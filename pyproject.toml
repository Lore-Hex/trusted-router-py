[project]
name = "trusted-router-py"
version = "0.3.4"
description = "Python SDK for TrustedRouter."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Lore Hex" }]
dependencies = ["httpx>=0.27.0", "pydantic>=2.6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
attestation = ["cryptography>=42"]

[project.urls]
Homepage = "https://trustedrouter.com"
Repository = "https://github.com/Lore-Hex/trusted-router-py"
Trust = "https://trust.trustedrouter.com"

[project.scripts]
trustedrouter = "trustedrouter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustedrouter"]

[dependency-groups]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "cryptography>=42",
  "mypy>=1.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=src/trustedrouter --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["src/trustedrouter"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.10"
files = ["src/trustedrouter", "tests"]
check_untyped_defs = true
warn_unused_configs = true
