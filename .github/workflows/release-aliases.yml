name: Release alias to PyPI

# Configure a PyPI trusted publisher for the alias project:
#   PyPI project name : trustedrouter
#   Owner             : Lore-Hex
#   Repository        : trusted-router-py
#   Workflow filename : release-aliases.yml
#   Environment       : pypi
# https://pypi.org/manage/account/publishing/
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ALIAS_DIST_DIR: dist/trustedrouter
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --group dev
      - run: uv build aliases/trustedrouter --out-dir "$ALIAS_DIST_DIR"
      - name: Verify alias artifacts and version floors
        run: |
          uv run pytest -o addopts= \
            tests/test_alias_distributions.py::test_alias_distribution \
            tests/test_alias_distributions.py::test_alias_versions
      - uses: actions/upload-artifact@v4
        with:
          name: dist-trustedrouter
          path: dist/trustedrouter/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-trustedrouter
          path: dist/trustedrouter/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/trustedrouter/
          # No `password:` — uses GitHub OIDC + PyPI's trusted publisher.
