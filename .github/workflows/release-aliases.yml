name: Release to PyPI

# This filename is retained because it is the only configured PyPI trusted
# publisher for the SDK, despite its former use for a metadata-only alias.
# The publisher fields must match exactly:
#   PyPI project name : trustedrouter
#   Owner             : Lore-Hex
#   Repository        : trusted-router-py (https://github.com/Lore-Hex/trusted-router-py)
#   Workflow filename : release-aliases.yml
#   Environment       : pypi
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run python scripts/boundary_check.py
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/mutation_check.py
      - run: uv run python scripts/consumer_mutation_check.py
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Verify distribution artifacts and tag version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PYTHON'
          import os
          import tarfile
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          artifacts = sorted(Path("dist").iterdir())
          assert len(artifacts) == 2, f"Expected wheel and sdist: {artifacts}"
          assert sum(p.name.endswith(".whl") for p in artifacts) == 1
          assert sum(p.name.endswith(".tar.gz") for p in artifacts) == 1
          versions = set()
          for path in artifacts:
              assert path.name.startswith("trustedrouter-"), path.name
              if path.name.endswith(".whl"):
                  with zipfile.ZipFile(path) as archive:
                      metadata_name, = (n for n in archive.namelist()
                                        if n.endswith(".dist-info/METADATA"))
                      metadata = BytesParser().parsebytes(archive.read(metadata_name))
              else:
                  with tarfile.open(path) as archive:
                      metadata_name, = (n for n in archive.getnames()
                                        if n.count("/") == 1 and n.endswith("/PKG-INFO"))
                      stream = archive.extractfile(metadata_name)
                      assert stream is not None
                      metadata = BytesParser().parsebytes(stream.read())
              assert metadata["Name"] == "trustedrouter", metadata["Name"]
              version = metadata["Version"]
              assert version, "Missing artifact version"
              expected_name = (f"trustedrouter-{version}-py3-none-any.whl"
                               if path.name.endswith(".whl")
                               else f"trustedrouter-{version}.tar.gz")
              assert path.name == expected_name, path.name
              versions.add(version)
              if os.environ["RELEASE_EVENT"] == "push":
                  assert os.environ["RELEASE_REF"] == f"refs/tags/v{version}", (
                      os.environ["RELEASE_REF"], version)
              print(f"Verified {path.name}")
          assert len(versions) == 1, f"Artifact versions disagree: {versions}"
          PYTHON
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # No `password:` — uses GitHub OIDC + PyPI's trusted publisher.

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release page after package publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release page already exists: $RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "TrustedRouter Python SDK $RELEASE_TAG" \
            --notes "Published on PyPI: https://pypi.org/project/trustedrouter/${RELEASE_TAG#v}/"
