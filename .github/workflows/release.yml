name: Release to PyPI

# Triggered when a `vX.Y.Z` tag is pushed. Uses PyPI Trusted Publishing
# (OIDC) — no API token needed once the publisher is configured at
# https://pypi.org/manage/account/publishing/. The publisher must match:
#   PyPI project name : trusted-router-py
#   Owner             : Lore-Hex
#   Repository        : trusted-router-py
#   Workflow filename : release.yml
#   Environment       : pypi  (matches the env: line below)
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run python scripts/boundary_check.py
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/mutation_check.py
      - run: uv run python scripts/consumer_mutation_check.py
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # No `password:` — uses GitHub OIDC + PyPI's trusted publisher.

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release page after package publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release page already exists: $RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "TrustedRouter Python SDK $RELEASE_TAG" \
            --notes "Published on PyPI: https://pypi.org/project/trusted-router-py/${RELEASE_TAG#v}/"
