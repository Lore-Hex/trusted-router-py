name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  import-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev --python ${{ matrix.python }}
      - run: uv run pytest -o addopts= tests/test_import_alias.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run python scripts/boundary_check.py
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/mutation_check.py
      - run: uv run python scripts/consumer_mutation_check.py
      - name: Upload coverage XML for downstream tools
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
